name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: finshield_test
          POSTGRES_USER: finshield
          POSTGRES_PASSWORD: test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finshield -d finshield_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://finshield:test_only@localhost:5432/finshield_test
      PAYSIM_PATH: data/sample/paysim_demo.csv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Pytest suite
        run: pytest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/test_browser_parity.mjs
